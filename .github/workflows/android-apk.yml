name: Android APK build

# Every push to main and every pull request builds the APKs as downloadable
# artifacts. A v* tag (or a manual run with a tag) also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v2.0.1); leave empty to only build"
        required: false
        default: ""

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Cactus runtimes
        uses: actions/cache@v4
        with:
          path: app/build/cactus/jniLibs
          key: cactus-${{ hashFiles('scripts/build-cactus.sh') }}

      # Signs with the release key when the repository secrets are set;
      # otherwise Gradle falls back to the debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "::warning::No signing secrets; building with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Release builds take their version from the tag (v2.1.0 → versionCode 20100),
      # which the in-app updater compares against update.json.
      - name: Build APKs (universal + per-ABI)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
        run: |
          ./gradlew :app:assembleRelease -PsplitAbi ${RELEASE_TAG:+-PreleaseVersion=$RELEASE_TAG}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release*.apk dist/app-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release*.apk dist/app-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release*.apk dist/app-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release*.apk dist/app-x86_64-release.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meowclaw-android
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "MeowClaw $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

      # The app reads releases/latest/download/update.json to find new versions.
      - name: Publish update.json
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          TAG="$TAG" NOTES="$NOTES" BASE="$BASE" python3 - <<'PY'
          import hashlib, json, os, re
          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          parts = [int(re.sub(r"\D", "", p) or 0) for p in version.split("-")[0].split(".")] + [0, 0, 0]
          apks = {}
          for abi in ["arm64-v8a", "armeabi-v7a", "x86_64", "universal"]:
              name = f"app-{abi}-release.apk"
              path = os.path.join("dist", name)
              data = open(path, "rb").read()
              apks[abi] = {"url": f"{os.environ['BASE']}/{name}", "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {
              "versionCode": parts[0] * 10000 + parts[1] * 100 + parts[2],
              "versionName": version,
              "tag": tag,
              "notes": os.environ.get("NOTES", ""),
              "releaseUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "apks": apks,
          }
          json.dump(manifest, open("update.json", "w"), indent=2)
          PY
          gh release upload "$TAG" update.json --clobber
