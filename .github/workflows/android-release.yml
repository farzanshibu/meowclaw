name: Android release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Cactus runtimes
        uses: actions/cache@v4
        with:
          path: app/build/cactus/jniLibs
          key: cactus-${{ hashFiles('scripts/build-cactus.sh') }}

      # Signs with the release key when the repository secrets are set;
      # otherwise Gradle falls back to the debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "::warning::No signing secrets; building with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APKs (universal + per-ABI)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          ./gradlew :app:assembleRelease -PsplitAbi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release*.apk dist/app-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release*.apk dist/app-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release*.apk dist/app-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release*.apk dist/app-x86_64-release.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meowclaw-android
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "MeowClaw $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
